# 相对路径均以 RiceDiseaseYOLO 项目根目录为基准，与 PyCharm 工作目录无关。
source_root: ../yolo官方数据集/archive/RiceLeafAnnotatedDataset
data_yaml: datasets/rice/data.yaml
weights_dir: weights
runs_dir: runs

train:
  model: yolo11n.pt
  epochs: 50
  imgsz: 640
  batch: 8
  workers: 2
  seed: 42
  device: auto
  patience: 30
  optimizer: auto
  pretrained: true
  amp: true
  cache: false

predict:
  conf: 0.25
  iou: 0.7

